
spring:
  application:
    name: teamflow
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
teamflow:
  jwt:
    secret: ${JWT_SECRET}
    issuer: teamflow
    access-token-minutes: 15
    refresh-days: 7
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  registration-enabled: ${REGISTRATION_ENABLED:false}
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  pattern:
    level: '%5p [traceId:%X{traceId:-}]'
