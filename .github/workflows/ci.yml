name: Server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests and package
        run: mvn -B -ntp clean verify
      - name: MySQL Testcontainers integration
        run: mvn -B -ntp -Dtest=ContainerMySqlIT test
