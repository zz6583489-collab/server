spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: false
teamflow:
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  registration-enabled: false
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
